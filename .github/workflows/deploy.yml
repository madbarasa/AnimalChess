name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布运行时静态资源，排除 .github/.ralph/.eslintrc 等元数据
          path: '.'
          exclusion_patterns: >-
            .github
            .ralph
            .eslintrc.json
            CODE_REVIEW.md
            *.md
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
