name: Deploy 3D to GitHub Pages

on:
  push:
    branches: [3D]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-3D"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        # 设置 base 路径为 /AnimalChess/3D/，适配 GitHub Pages 子路径
        # Vite 的 base 配置会自动处理资源路径、路由等
        run: |
          echo "VITE_BASE_URL=/AnimalChess/3D/" >> .env
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: 3D
          # 这会把 dist/ 内容推送到 gh-pages 分支的 /3D/ 目录下
          # 最终访问地址：https://madbarasa.github.io/AnimalChess/3D/
          enable_jekyll: false