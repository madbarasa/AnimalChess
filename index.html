<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP_TITLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 第三个动态光晕球 -->
<div class="bg-orb"></div>

<div id="app">
    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="panel">
        <div class="status-card">
            <div id="turn-display">--</div>

            <!-- 侧边统计面板 -->
            <div id="stats-panel"></div>

            <div class="btn-group">
                <button id="btn-pve" class="active">PVE</button>
                <button id="btn-pvp">PVP</button>
            </div>
            <div class="ai-config">
                <label>AI ENGINE</label>
                <select id="ai-personality">
                    <option value="aggressive" selected>MODE_A</option>
                    <option value="conservative">MODE_B</option>
                </select>
            </div>
        </div>

        <button id="btn-reset">RESET</button>

        <div id="log-container"></div>
    </div>
</div>

<!-- VICTORY SCREEN -->
<div id="victory-overlay" class="hidden">
    <div class="victory-card">
        <h1 id="victory-title">VICTORY</h1>
        <p id="victory-msg">--</p>
        <div class="victory-stats">
            <span id="victory-time">--</span>
        </div>
        <button id="btn-restart-win">RESTART</button>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
