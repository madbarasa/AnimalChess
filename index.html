<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗兽棋 Pro v2.6.1 - Tactical Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" aria-label="斗兽棋棋盘，点击选择棋子并移动到目标格" role="img"></canvas>
        <!-- P3-2 CSS 脉冲叠层：河道呼吸效果 -->
        <div id="river-pulse"></div>
    </div>

    <div class="panel">
        <div class="status-card">
            <div id="turn-display" aria-live="polite">--</div>
            <div class="btn-group">
                <button id="btn-pve" class="active" aria-pressed="true">单人挑战</button>
                <button id="btn-pvp" aria-pressed="false">双人对决</button>
            </div>
            <div class="ai-config" style="margin-top: 15px;">
                <label for="ai-personality" style="font-size: 12px; color: #888; display: block; margin-bottom: 5px;">AI 性格</label>
                <select id="ai-personality" aria-label="选择 AI 难度模式" style="width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; outline: none;">
                    <option value="aggressive" selected>积极型</option>
                    <option value="conservative">保守型</option>
                </select>
            </div>
        </div>

        <button id="btn-reset" style="border-color: rgba(255, 77, 77, 0.3); color: #ff4d4d" aria-label="重新开始游戏">🔄 重新开始</button>

        <div id="log-container" aria-label="游戏日志"></div>
    </div>
</div>

<!-- VICTORY SCREEN -->
<div id="victory-overlay" class="hidden" role="dialog" aria-labelledby="victory-title" aria-modal="true">
    <div class="victory-card">
        <h1 id="victory-title">VICTORY</h1>
        <p id="victory-msg">--</p>
        <div class="victory-stats">
            <span id="victory-time">--</span>
        </div>
        <button id="btn-restart-win" aria-label="重新开始">再次征战</button>
    </div>
</div>

<!-- 配置数据（规则数据 / UI 文案分离，见 config.js 文件头） -->
<script src="config.js"></script>
<!-- 规则唯一实现来源：主线程与 AI Worker 共用 rules.js（见 rules.js 文件头） -->
<script src="rules.js"></script>
<!-- AI 引擎独立源文件：页面只加载，真正运行在 game.js 构造的 Worker Blob 里 -->
<script src="ai-worker.js"></script>
<!-- 渲染职责（P2-3）与棋局/规则状态职责（P2-3），game.js 只做编排入口 -->
<script src="renderer.js"></script>
<script src="game-state.js"></script>
<script src="game.js"></script>
</body>
</html>
